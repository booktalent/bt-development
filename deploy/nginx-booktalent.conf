# =============================================================================
# BookTalent — nginx site config for VPS deployment
# =============================================================================
# Copy this file to `/etc/nginx/sites-available/booktalent.in.conf` and enable:
#   sudo ln -s /etc/nginx/sites-available/booktalent.in.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Assumptions:
#   • Backend uvicorn is running on 127.0.0.1:8001 (via systemd or pm2)
#   • Frontend build is served from /var/www/booktalent/frontend/build
#   • SSL certificates are managed by certbot — see certbot section below.
# =============================================================================

# ─── Rate limit zones (used inside server{}) ──────────────────────────────────
limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=api_auth:10m    rate=5r/s;
limit_req_zone $binary_remote_addr zone=api_upload:10m  rate=10r/s;

# ─── HTTP → HTTPS redirect ────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name booktalent.in www.booktalent.in;
    return 301 https://$host$request_uri;
}

# ─── HTTPS server ─────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name booktalent.in www.booktalent.in;

    # ── SSL (certbot will fill these in) ──────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/booktalent.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/booktalent.in/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # ── Global upload limit (SEC + chunk-upload requirement) ─────────────────
    # Chunk size is 4 MB; headroom of 5× for multipart overhead + occasional
    # KYC/document uploads. Increase only if legitimate uploads exceed 20 MB.
    client_max_body_size    20M;
    client_body_buffer_size 1M;
    client_body_timeout     60s;
    send_timeout            60s;

    # ── Gzip ──────────────────────────────────────────────────────────────────
    gzip on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    # CORS is enforced by the FastAPI middleware (see CORS_ORIGINS in backend/.env).
    # Do NOT set Access-Control-* headers here — it would collide/override.

    # ── /api → FastAPI (uvicorn on 8001) ─────────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Rate limiting — different buckets for auth vs generic API
        limit_req zone=api_general burst=50 nodelay;
    }

    # Tighter rate limit on auth endpoints (brute-force + OTP flooding)
    location ~ ^/api/auth/(login|forgot-password|email/send|email/verify) {
        proxy_pass         http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        limit_req zone=api_auth burst=10 nodelay;
    }

    # Chunked upload endpoints — allow higher burst + longer timeouts
    location ~ ^/api/(media/video|uploads)/ {
        proxy_pass         http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_body_timeout 600s;
        limit_req zone=api_upload burst=20 nodelay;
    }

    # WebSocket upgrade path for live chat
    location /api/ws/ {
        proxy_pass         http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── / → React SPA (static build) ─────────────────────────────────────────
    root /var/www/booktalent/frontend/build;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Immutable-cache all hashed static assets (React build).
    location ~* \.(js|css|woff2?|png|jpg|jpeg|gif|svg|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Deny access to hidden files (.env, .git, etc.) if any slipped into build.
    location ~ /\. {
        deny all;
    }
}

# =============================================================================
# One-time TLS setup (certbot)
# =============================================================================
# sudo apt install certbot python3-certbot-nginx
# sudo certbot --nginx -d booktalent.in -d www.booktalent.in
# Auto-renew via systemd timer (installed by certbot). Verify with:
# sudo systemctl list-timers | grep certbot
